<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="author" content="Farshad Nassiri">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D0E" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:site_name" content="Farshad Nassiri — Fractional CFO &amp; FP&amp;A">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
<!-- Fonts are served from this site, so there is no third-party stylesheet to
     fetch first. Preloaded because the stylesheet only reveals them a round
     trip later, and both are needed for the first screen. -->
<link rel="preload" href="{{base}}assets/fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{base}}assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{base}}assets/css/main.css">
<!-- Deferred, and in the head: the browser starts fetching them while it is
     still parsing the HTML, and runs them in order once it has finished. At the
     end of the body they could only start downloading after the whole document
     had been parsed. -->
<script src="{{base}}assets/js/config.js" defer></script>
<script src="{{base}}assets/js/site.js" defer></script>
{{scripts}}
<script>
  /* Set the theme before first paint to avoid a flash. */
  (function () {
    try {
      var t = localStorage.getItem('fn-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    /* Marks that JS is running, which is what gates the reveal animation.
       Without it every .reveal element stays fully visible. */
    document.documentElement.classList.add('js');
  })();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{nav}}
<main id="main">
{{body}}
</main>
{{footer}}
</body>
</html>
