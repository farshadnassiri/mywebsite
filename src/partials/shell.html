<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="author" content="Farshad Nassiri">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D0E" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:site_name" content="Farshad Nassiri — Fractional CFO &amp; FP&amp;A">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{base}}assets/css/main.css">
<script>
  /* Set the theme before first paint to avoid a flash. */
  (function () {
    try {
      var t = localStorage.getItem('fn-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    /* Marks that JS is running, which is what gates the reveal animation.
       Without it every .reveal element stays fully visible. */
    document.documentElement.classList.add('js');
  })();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{nav}}
<main id="main">
{{body}}
</main>
{{footer}}
<script src="{{base}}assets/js/config.js"></script>
<script src="{{base}}assets/js/site.js"></script>
{{scripts}}
</body>
</html>
